- vars:
    userInput: Alert me if we get fewer than 10 leads this week.
  assert:
    - type: is-json
      value:
        type: object
        required:
          - trigger
          - schedule
          - query
        properties:
          trigger:
            type: string
          schedule:
            type: string
          query:
            type: string

